name: Staging checks

on:
  push:
    branches: [staging]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache API fallback data
        uses: actions/cache@v4
        with:
          path: .cache/api-fallback
          key: api-fallback-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-fallback-${{ runner.os }}-

      - name: Build site without generated OG assets
        run: npm run build:no-og
        env:
          # CI-PERF-01A: single build serves verify + Playwright + optional
          # staging deploy. Only the staging deploy path needs the
          # /www-staging/ pathPrefix, so PR builds run prefix-free — that
          # matches what Playwright expects when navigating root-relative
          # URLs against the static-served _site artifact.
          ELEVENTY_PATH_PREFIX: ${{ github.ref == 'refs/heads/staging' && '/www-staging/' || '' }}
          # Optional: YouTube API key was previously supplied to the
          # Playwright build. Keep it available so the shared build has
          # the same environment; missing secret is tolerated by the
          # build (falls back to cached data).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE }}

      - name: Prevent Jekyll build in www-staging
        run: touch _site/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: staging-site
          path: _site/
          retention-days: 3

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: staging-site
          path: _site/

      - name: i18n / SEO check
        run: npm run check:i18n-seo

      - name: SEO health check
        run: npm run check:seo-health

      - name: No null OG images
        run: '! rg -n "https://www\.jarilaru\.fi/null|<meta property=\"og:image\" content=\"null\"|<meta name=\"twitter:image\" content=\"null\"" _site'

      - name: robots.txt exists
        run: test -f _site/robots.txt

      - name: robots.txt blocks GPTBot
        run: 'grep -q "User-agent: GPTBot" _site/robots.txt'

      - name: Homepage robots meta
        run: grep -q '<meta name="robots" content="index, follow">' _site/index.html

      - name: Homepage has description meta
        run: grep -q '<meta name="description" content="' _site/index.html

      - name: Homepage has canonical
        run: grep -q '<link rel="canonical" href="https://www.jarilaru.fi/">' _site/index.html

      - name: Homepage has hreflang tags
        run: |
          grep -q 'hreflang="fi"' _site/index.html
          grep -q 'hreflang="en"' _site/index.html
          grep -q 'hreflang="x-default"' _site/index.html

      - name: No null OG image on homepage
        run: |
          ! grep -q '<meta property="og:image" content="https://www.jarilaru.fi/null">' _site/index.html
          ! grep -q '<meta property="og:image" content="null">' _site/index.html

      - name: Sitemap exists and contains key URLs
        run: |
          test -f _site/sitemap.xml
          grep -q 'loc>https://www.jarilaru.fi/esitykset/<' _site/sitemap.xml
          grep -q 'loc>https://www.jarilaru.fi/en/presentations/<' _site/sitemap.xml
          grep -Eq '<loc>https://www\.jarilaru\.fi/esitykset/</loc><lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}T[^<]+</lastmod>' _site/sitemap.xml
          grep -Eq '<loc>https://www\.jarilaru\.fi/en/presentations/</loc><lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}T[^<]+</lastmod>' _site/sitemap.xml

      - name: EN feed exists
        run: test -f _site/en/feed.xml

      - name: FI feed exists
        run: test -f _site/feed.xml

      - name: Canva section on presentations pages
        run: |
          grep -q 'id="canva-heading"' _site/esitykset/index.html
          grep -q 'id="canva-heading"' _site/en/presentations/index.html

      - name: EN pages have English skip-link
        run: grep -q 'Skip to main content' _site/en/about/index.html

  playwright:
    # CI-PERF-01A: only PR events run Playwright. The staging-deploy path
    # (push:staging) uses a /www-staging/-prefixed build that would break
    # Playwright's root-relative navigation. This matches the previous
    # behavior where accessibility-navigation.yml ran only on pull_request.
    #
    # CI-PERF-01B: path-aware test selection. If the PR touches ONLY
    # the single explicitly audited course page
    # (src/opetus/teknologiatuettu-oppiminen-2026-a.md), run just the
    # scoped course-page spec. ANY other change — including any other
    # file under src/opetus/, shared templates, JS, CSS, data pipeline,
    # config, workflow itself, or any unknown path — falls back to the
    # full accessibility+navigation+contrast suite. File extension or
    # directory membership alone is NOT sufficient to classify Eleventy
    # source as content-only; new course/teaching sources must be
    # audited and added to this allowlist explicitly. Fail-safe:
    # classification failure defaults to full regression.
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Need base..head range for path classification. Full history is
          # simplest; the checkout is tiny compared to Playwright install.
          fetch-depth: 0

      - name: Classify PR changed paths
        id: classify
        # Fail-safe: any script failure or unrecognized path keeps
        # course_content_only=false → full regression runs.
        shell: bash
        run: |
          set +e
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          echo "Base: $base"
          echo "Head: $head"
          git fetch --no-tags origin "$base" 2>/dev/null || true
          changed=$(git diff --name-only "$base" "$head" 2>/dev/null)
          if [ -z "$changed" ]; then
            echo "Could not determine changed files → defaulting to full regression"
            echo "course_content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          # CI-PERF-01B audited LOW-RISK allowlist: exactly one explicitly
          # audited course page. All other src/opetus/*.md files (including
          # future course pages, index pages, and hub pages) default to
          # full regression until they are individually audited and added
          # to this allowlist. File extension or directory membership is
          # not sufficient — Eleventy/Nunjucks source can hide SSR logic.
          allowlist='^src/opetus/teknologiatuettu-oppiminen-2026-a\.md$'
          non_allowed=$(echo "$changed" | grep -v -E "$allowlist")
          if [ -z "$non_allowed" ]; then
            echo ""
            echo "→ Only the audited course page changed (LOW-RISK content-only)"
            echo "course_content_only=true" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "→ HIGH-RISK / shared / unknown paths detected → full regression"
            echo "$non_allowed" | sed 's/^/    - /'
            echo "course_content_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: staging-site
          path: _site/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scoped course-page test (content-only PR)
        if: steps.classify.outputs.course_content_only == 'true'
        run: npx playwright test tests/course-page-01.spec.js
        env:
          PLAYWRIGHT_USE_STATIC_SERVER: "true"
          PLAYWRIGHT_A11Y_OFFLINE: "true"

      - name: Run full accessibility + navigation + contrast regression
        if: steps.classify.outputs.course_content_only != 'true'
        run: npx playwright test tests/accessibility.spec.js tests/navigation.spec.js tests/contrast.spec.js
        env:
          PLAYWRIGHT_USE_STATIC_SERVER: "true"
          PLAYWRIGHT_A11Y_OFFLINE: "true"

  deploy:
    needs: [build, verify]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: staging-site
          path: _site/

      - name: Deploy to www-staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          external_repository: LaruX75/www-staging
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
